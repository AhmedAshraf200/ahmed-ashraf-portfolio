<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a52d5"/>
      <stop offset="100%" stop-color="#8a84ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="400" fill="url(#bgGrad)"/>
  <rect width="800" height="400" fill="url(#grid)"/>

  <!-- coordinate axes -->
  <line x1="60" y1="340" x2="740" y2="340" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  <line x1="90" y1="60" x2="90" y2="370" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>

  <!-- original square (dashed, "before" transform) -->
  <rect x="180" y="230" width="90" height="90" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- rotated/scaled square ("after" transform) -->
  <g transform="translate(255,275) rotate(-18) scale(1.35)">
    <rect x="-45" y="-45" width="90" height="90" fill="rgba(255,255,255,0.18)" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- circle with translation vector -->
  <circle cx="470" cy="290" r="42" fill="rgba(255,255,255,0.12)" stroke="#ffffff" stroke-width="3"/>
  <circle cx="560" cy="200" r="42" fill="rgba(255,255,255,0.28)" stroke="#ffffff" stroke-width="3"/>
  <line x1="470" y1="290" x2="552" y2="212" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4 5"/>
  <polygon points="552,212 540,214 546,224" fill="#ffffff"/>

  <!-- triangle (rotation arc) -->
  <polygon points="650,300 690,300 670,250" fill="rgba(255,255,255,0.15)" stroke="#ffffff" stroke-width="3"/>
  <path d="M 700 260 A 45 45 0 0 1 690 220" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <polygon points="688,222 692,214 696,224" fill="#ffffff"/>

  <!-- title -->
  <text x="60" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Graphics Package Algorithms</text>
  <text x="60" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="rgba(255,255,255,0.85)">2D Transformations &amp; Rendering — C# Desktop App</text>
</svg>
